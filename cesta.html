<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de cesta básica · Super Adega × Santa Therezinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme: light;
  --red:#E4333A; --navy:#2F367A;
  --ink:#1B1F45; --muted:#676C88; --line:#E6E7EF; --surface:#F6F7FB; --bg:#FFFFFF;
  --ok:#1E8A52; --ok-bg:#E8F5EE; --warn:#B86E00; --warn-bg:#FFF4E0; --crit:#D42A31; --crit-bg:#FDECEC;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --gap:clamp(10px,1.4vh,18px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
img{max-width:100%}
:focus-visible{outline:3px solid #7C83D6;outline-offset:2px}

/* Estrutura de tela cheia: tudo cabe na janela */
.app{display:flex;flex-direction:column;gap:var(--gap);padding:clamp(10px,1.6vh,18px) 92px clamp(10px,1.6vh,18px) clamp(14px,2vw,28px);max-width:1800px;margin:0 auto}

/* Cabeçalho compacto: logos, título e abas numa linha */
.top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:24px}
.top .adega{width:clamp(120px,9vw,160px);display:block}
.top .santa{width:clamp(100px,7.5vw,130px);display:block}
.top h1{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(24px,2.4vw,34px);line-height:1;color:var(--navy)}
.stripes{display:grid;gap:3px;margin-top:-4px}
.stripes span{height:4px;background:var(--navy);border-radius:0 4px 4px 0}
.stripes span:nth-child(2){width:70%}
.stripes span:nth-child(3){width:42%;background:var(--red)}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:11px}
.tab{border:0;background:transparent;font:600 14px var(--body);color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}

.alert{background:var(--crit-bg);color:#8F1B20;border-radius:10px;padding:8px 14px;font-size:14px}

/* Botão de importação na lateral */
.side-import{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20}
.btn-import{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:var(--red);color:#fff;border:0;border-radius:14px 0 0 14px;padding:14px 12px;font:700 13px var(--body);line-height:1.15;text-align:center;cursor:pointer;box-shadow:-4px 6px 18px rgba(228,51,58,.28)}
.btn-import:hover{background:#C9262D}

/* Painéis */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,1.4vw,22px);align-items:start}
.panel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-width:0;display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;color:#fff}
.c10 .panel-head{background:var(--red)}
.c15 .panel-head{background:var(--navy)}
.panel-head h2{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;line-height:1.1}
.head-right{display:flex;align-items:center;gap:12px;font-size:12.5px}
.btn-detail{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:7px;padding:4px 10px;font:600 12.5px var(--body);cursor:pointer}
.btn-detail:hover{background:rgba(255,255,255,.15)}
.panel-body{padding:var(--gap) 16px;display:flex;flex-direction:column;gap:var(--gap);flex:1;min-height:0}

/* Linha de resumo: estoque do CD + três números */
.summary{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hero{padding:10px 14px}
.hero.ok{background:var(--ok-bg)} .hero.warn{background:var(--warn-bg)} .hero.crit{background:var(--crit-bg)} .hero.neutral{background:var(--surface)}
.hero .lbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(30px,2.6vw,40px);line-height:1}
.hero .big small{font-size:.45em;font-weight:600;margin-left:4px;color:var(--muted)}
.hero .dur{font-size:13px;color:var(--muted)}
.hero .dur b{font-family:var(--display);font-size:20px}
.hero.ok .dur b{color:var(--ok)} .hero.warn .dur b{color:var(--warn)} .hero.crit .dur b{color:var(--crit)} .hero.neutral .dur b{color:var(--ink)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;color:#fff;vertical-align:1px}
.pill.ok{background:var(--ok)} .pill.warn{background:var(--warn)} .pill.crit{background:var(--crit)}
.fact{padding:10px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.fact span{font-size:12.5px;color:var(--muted)}
.fact strong{font-family:var(--display);font-weight:700;font-size:clamp(20px,1.7vw,26px);line-height:1.15;white-space:nowrap}
.fact em{font-style:normal;font-size:12px;color:var(--muted)}
.t-up{color:var(--ok)} .t-down{color:var(--crit)} .t-flat{color:var(--muted)}

/* Gráficos ocupam o espaço restante */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
.charts.single{grid-template-columns:1fr}
.chart{display:flex;flex-direction:column;min-height:0}
h3{margin:0;font-size:14px;font-weight:700}
.hint{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.chart-box{position:relative;height:clamp(190px,34vh,320px)}

/* Detalhes em janela */
dialog{border:0;border-radius:14px;padding:0;max-width:min(860px,94vw);width:100%;box-shadow:0 20px 60px rgba(27,31,69,.25)}
dialog::backdrop{background:rgba(27,31,69,.35)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-size:16px}
.dlg-close{border:0;background:var(--surface);border-radius:8px;padding:6px 12px;font:600 13px var(--body);cursor:pointer;color:var(--ink)}
.dlg-body{padding:14px 18px 18px;max-height:75vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface);font-weight:600;color:var(--muted);font-size:13px}
tbody tr+tr td{border-top:1px solid var(--line)}
tfoot td{border-top:2px solid var(--line);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Telas de computador: o painel ocupa exatamente a janela */
@media (min-width:1000px) and (min-height:560px){
  html,body{height:100%}
  .app{height:100%}
}
/* Telas pequenas: rolagem normal */
@media (max-width:999px), (max-height:559px){
  .app{padding-right:clamp(14px,2vw,28px);padding-bottom:90px}
  .grid,#tab-estoque{grid-template-columns:1fr}
  .chart-box{height:240px}
  .side-import{top:auto;transform:none;right:16px;bottom:16px}
  .btn-import{flex-direction:row;border-radius:999px;padding:12px 18px}
  .btn-import br{display:none}
}
@media (max-width:700px){
  .top{grid-template-columns:auto auto;justify-content:space-between}
  .top h1{grid-column:1/-1;order:3}
  .tabs{grid-column:1/-1;order:4;justify-self:start}
  .summary{grid-template-columns:1fr 1fr}
  .hero{grid-column:1/-1}
  .fact:nth-child(2){border-left:0}
  .charts{grid-template-columns:1fr}
}
/* Comissão */
.com-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:clamp(12px,1.4vw,22px);align-items:start}
.c-navy .panel-head{background:var(--navy)}
.c-red .panel-head{background:var(--red)}
.head-right select{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:4px 8px;font:600 12.5px var(--body)}
.head-right select option{color:var(--ink)}
.com-kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.com-kpis .fact:first-child{border-left:0}
.com-kpis .fact.total{background:var(--ok-bg)}
.com-kpis .fact.total strong{color:var(--ok)}
.com-table{border:1px solid var(--line);border-radius:12px;overflow:auto}
.com-table table{font-size:13.5px}
.com-table td,.com-table th{padding:8px 10px}
.com-table td.nome{white-space:normal;min-width:180px;font-weight:600}
.com-table td.nome small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.com-table tr.off td{color:var(--muted)}
.com-table td.tot{font-weight:700}
.st-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:600 12px var(--body);cursor:pointer;color:var(--ok)}
.st-btn.ferias{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.form label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.form input[type=date]{font:500 14px var(--body);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;max-width:200px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--navy);width:16px;height:16px}
.btn-add{justify-self:start;background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:700 14px var(--body);cursor:pointer}
.btn-add:hover{background:#252B66}
.form-msg{font-size:12.5px;color:var(--crit);min-height:0}
.rem-list{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:clamp(120px,24vh,260px)}
.rem-list table{font-size:13.5px}
.rem-list td{padding:7px 10px}
.rem-list td.who{white-space:normal;text-align:left;color:var(--muted);font-size:12.5px}
.btn-del{border:0;background:transparent;color:var(--crit);font:600 12.5px var(--body);cursor:pointer;padding:2px 4px}
.mini-title{display:flex;justify-content:space-between;align-items:baseline}
@media (max-width:999px), (max-height:559px){ .com-grid{grid-template-columns:1fr} }
@media (max-width:700px){ .com-kpis{grid-template-columns:1fr 1fr} .com-kpis .fact:nth-child(3){border-left:0} }
/* Estoque nas lojas */
.c-stock .panel-head{background:var(--ink)}
.c-stock .panel-head h2{font-size:22px}
.stock-body{gap:8px}
.stock-table{border:1px solid var(--line);border-radius:12px;overflow:auto}
.stock-table table{font-size:13px}
.stock-table th,.stock-table td{padding:6px 9px}
.stock-table td:first-child{font-weight:600;white-space:normal}
.stock-table td.low{color:var(--crit);font-weight:700}
.low-txt{color:var(--crit);font-weight:600}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px}
.sw.s10{background:var(--red)} .sw.s15{background:var(--navy)}
.stock-strip{grid-column:1/-1;padding:10px 16px 12px;gap:6px}
.strip-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.stock-strip .stock-table td:first-child{white-space:nowrap}
.stock-strip table{table-layout:fixed}
.stock-strip th,.stock-strip td{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-strip th:first-child,.stock-strip td:first-child{text-align:left;width:90px}
.stock-strip th:last-child,.stock-strip td:last-child{text-align:right}
/* A faixa só aparece quando a tela tem altura para ela */
@media (max-height:879px) and (min-width:1000px){ .stock-strip{display:none} }
@media (max-width:1500px){
  .hero .big{font-size:30px}
  .fact strong{font-size:20px}
  .fact span,.hero .lbl,.fact em,.hero .dur{font-size:12px}
  .fact,.hero{padding:8px 10px}
}
/* Itens da cesta */
.side-import{display:flex;flex-direction:column;gap:8px}
.btn-import.alt{background:var(--navy);box-shadow:-4px 6px 18px rgba(47,54,122,.28)}
.btn-import.alt:hover{background:#252B66}
.btn-import:disabled{opacity:.7;cursor:wait}
#tab-itens{display:block}
.itens-table{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 330px);min-height:180px}
.itens-table table{font-size:13.5px}
.itens-table th,.itens-table td{padding:7px 12px}
.itens-table thead th{position:sticky;top:0;z-index:1}
.itens-table tfoot td{position:sticky;bottom:0;background:#fff}
.itens-table td.desc{text-align:left;font-weight:600}
.itens-table th:nth-child(2){text-align:left}
.itens-table td.dias b{font-weight:700}
.itens-table td.dias.crit{color:var(--crit)} .itens-table td.dias.warn{color:var(--warn)} .itens-table td.dias.ok{color:var(--ok)}
.itens-table tr.row-crit td{background:var(--crit-bg)}
.itens-table th small{font-weight:500;font-size:11.5px}
.fact.kpi-crit{background:var(--crit-bg)} .fact.kpi-crit strong{color:var(--crit)}
.fact.kpi-ok{background:var(--ok-bg)} .fact.kpi-ok strong{color:var(--ok)}
.colab-form{display:grid;grid-template-columns:1fr 2fr;gap:12px 16px}
.colab-form label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.colab-form input,.colab-form select{font:500 14px var(--body);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.head-right .btn-detail{margin-left:4px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.share{min-width:170px}
.bar{display:inline-block;width:110px;height:8px;background:var(--surface);border-radius:4px;margin-right:8px;vertical-align:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.com-kpis .fact em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog{max-width:min(1000px,96vw)}
.rev-table{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:55vh}
.rev-table td{padding:4px 6px}
.rev-table th:nth-child(2){text-align:left}
.rev-table input{font:500 13px var(--body);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
.rev-table td:nth-child(3) input,.rev-table td:nth-child(4) input{text-align:right}
.rev-actions{display:flex;gap:10px;align-items:center;margin-top:12px}
@media (max-width:999px), (max-height:559px){ .side-import{flex-direction:row} .itens-table{max-height:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const DEFAULT_DATA = {"10": {"key": "10", "filiais": [{"filial": "GAMA", "disponivel": 8, "vlr": 37.73, "vendaMes": 317, "meses": [295, 356, 411]}, {"filial": "GUARA", "disponivel": 11, "vlr": 37.73, "vendaMes": 303, "meses": [316, 318, 191]}, {"filial": "STA", "disponivel": 47, "vlr": 38.1846, "vendaMes": 23, "meses": [41, 56, 73]}, {"filial": "VALPARAIO", "disponivel": 63, "vlr": 35.93, "vendaMes": 248, "meses": [318, 292, 225]}, {"filial": "SAMAMBAIA", "disponivel": 78, "vlr": 37.73, "vendaMes": 175, "meses": [250, 252, 146]}, {"filial": "QNL", "disponivel": 85, "vlr": 37.73, "vendaMes": 136, "meses": [257, 276, 316]}, {"filial": "JARDIM BOTANICO", "disponivel": 165, "vlr": 37.73, "vendaMes": 244, "meses": [406, 245, 106]}, {"filial": "SAI", "disponivel": 217, "vlr": 37.73, "vendaMes": 208, "meses": [275, 333, 316]}, {"filial": "PISTÃO", "disponivel": 419, "vlr": 37.73, "vendaMes": 237, "meses": [293, 188, 244]}], "producao": [{"paletes": 16, "multiplo": 60, "quantidade": 960, "data": "2026-10-16", "valor": 36220.8}, {"paletes": 12, "multiplo": 60, "quantidade": 720, "data": "2026-10-19", "valor": 27165.6}], "meses": ["Mês 1", "Mês 2", "Mês 3"], "codigo": 368978, "descricao": "CESTA BASICA SUPER CESTA 10 ITEN"}, "15": {"key": "15", "filiais": [{"filial": "STA", "disponivel": 5, "vlr": 65.3169, "vendaMes": 1, "meses": [78, 77, 18]}, {"filial": "QNL", "disponivel": 25, "vlr": 68.58, "vendaMes": 203, "meses": [215, 250, 177]}, {"filial": "JARDIM BOTANICO", "disponivel": 34, "vlr": 68.58, "vendaMes": 150, "meses": [297, 370, 384]}, {"filial": "SAI", "disponivel": 38, "vlr": 66.56, "vendaMes": 129, "meses": [207, 282, 324]}, {"filial": "GUARA", "disponivel": 58, "vlr": 66.56, "vendaMes": 153, "meses": [198, 181, 196]}, {"filial": "PISTÃO", "disponivel": 109, "vlr": 68.58, "vendaMes": 70, "meses": [318, 295, 242]}, {"filial": "VALPARAISO", "disponivel": 110, "vlr": 65.32, "vendaMes": 87, "meses": [235, 155, 196]}, {"filial": "GAMA", "disponivel": 120, "vlr": 68.58, "vendaMes": 112, "meses": [369, 272, 215]}, {"filial": "SAMAMBAIA", "disponivel": 183, "vlr": 66.56, "vendaMes": 64, "meses": [116, 119, 114]}], "producao": [], "meses": ["Mês 1", "Mês 2", "Mês 3"], "codigo": 362628, "descricao": "CESTA BASICA SUPER CESTA 15 ITEN"}};
// Centro de distribuição: aceita o nome novo (STA) ou o número antigo (41)
const CD_IDS = ['STA','41'];
const isCD = f => CD_IDS.includes(String(f.filial).trim().toUpperCase());
const lojaNome = v => String(v??'').trim().replace(/^filial\s+/i,'');
const MES_RECENTE_POR_ULTIMO = true; // "Mês 3" é o mês mais recente
const state = { data: DEFAULT_DATA, charts: [] };

const nf = (v, d=0) => (v==null||isNaN(v)) ? '–' : v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl = v => (v==null||isNaN(v)) ? '–' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlK = v => (v==null||isNaN(v)) ? '–' : (Math.abs(v)>=10000 ? 'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : brl(v));
const num = v => { if(v==null||v==='') return null; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/\./g,'').replace(',','.')); return isNaN(n)?null:n; };
const norm = s => String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const sum = a => a.reduce((s,v)=>s+(v||0),0);
const colorFor = key => key==='10' ? '#E4333A' : key==='15' ? '#2F367A' : '#5A61A8';
const softFor  = key => key==='10' ? '#F6B9BC' : key==='15' ? '#B5B8DC' : '#C9CBE6';

function toDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return v;
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400000));
  const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m) return new Date(Date.UTC(+(m[3].length===2?'20'+m[3]:m[3]), m[2]-1, +m[1]));
  const d=new Date(v); return isNaN(d)?null:d;
}
const fmtDate = d => d ? d.toLocaleDateString('pt-BR',{timeZone:'UTC'}) : '–';

/* ---------- Leitura da planilha ---------- */
function parseWorkbook(wb){
  const out={};
  wb.SheetNames.forEach(name=>{
    const n=norm(name); const m=n.match(/(\d+)/); if(!m) return;
    const key=m[1];
    const c = out[key] ||= {key, filiais:[], producao:[], meses:[]};
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    if(n.includes('produ')){
      const hi = rows.findIndex(r=>r && r.some(v=>norm(v).includes('palete')));
      if(hi<0) return;
      const h = rows[hi].map(norm);
      const find = f => h.findIndex(f);
      const iP=find(x=>x.includes('palete')), iM=find(x=>x.startsWith('multiplo')),
            iQ=find(x=>x==='quantidade'), iD=find(x=>x.includes('data')),
            iV=find(x=>x.includes('valor')||x.includes('custo')||x.startsWith('coluna'));
      rows.slice(hi+1).forEach(r=>{
        if(!r) return;
        const p=num(r[iP]), mu=num(r[iM]); let q=iQ>=0?num(r[iQ]):null;
        if(!q && p && mu) q=p*mu;
        if(!q) return;
        const d=toDate(r[iD]);
        c.producao.push({paletes:p, multiplo:mu, quantidade:q, data:d?d.toISOString().slice(0,10):null, valor:iV>=0?num(r[iV]):null});
      });
    } else {
      const hi = rows.findIndex(r=>r && r.some(v=>norm(v)==='filial'));
      if(hi<0) return;
      const raw=rows[hi], h=raw.map(norm);
      const find = f => h.findIndex(f);
      const iF=find(x=>x==='filial'), iC=find(x=>x.startsWith('codigo')), iDs=find(x=>x.startsWith('descri')),
            iDisp=find(x=>x.startsWith('disponivel')||x.startsWith('estoque')), iV=find(x=>x.includes('vlr')||x.includes('entrada')),
            iVM=find(x=>x==='venda mes'||x.startsWith('venda mes'));
      const iMs = h.map((x,i)=>/^mes \d+$/.test(x)?i:-1).filter(i=>i>=0)
                   .sort((a,b)=>parseInt(h[a].slice(4))-parseInt(h[b].slice(4)));
      c.meses = iMs.map(i=>String(raw[i]));
      rows.slice(hi+1).forEach(r=>{
        if(!r || r[iF]==null || r[iF]==='') return;
        if(iC>=0 && r[iC]!=null) c.codigo=r[iC];
        if(iDs>=0 && r[iDs]) c.descricao=r[iDs];
        c.filiais.push({filial:String(r[iF]).trim(), disponivel:num(r[iDisp])||0, vlr:iV>=0?num(r[iV]):null,
                        vendaMes:iVM>=0?(num(r[iVM])||0):null, meses:iMs.map(i=>num(r[i])||0)});
      });
    }
  });
  // valor de produção ausente: usa o custo médio de entrada
  Object.values(out).forEach(c=>{
    const vs=c.filiais.map(f=>f.vlr).filter(v=>v!=null);
    const avg=vs.length?sum(vs)/vs.length:null;
    c.producao.forEach(p=>{ if(p.valor==null && avg) p.valor=p.quantidade*avg; });
  });
  return out;
}

/* ---------- Cálculos ---------- */
function slope(ys){
  const n=ys.length; if(n<2) return 0;
  const xm=(n-1)/2, ym=sum(ys)/n; let a=0,b=0;
  ys.forEach((y,x)=>{a+=(x-xm)*(y-ym); b+=(x-xm)**2;});
  return b?a/b:0;
}
function trendInfo(ys){
  const avg=sum(ys)/(ys.length||1); const pct = avg ? slope(ys)/avg : 0;
  const cls = pct>0.05?'up':pct<-0.05?'down':'flat';
  return {pct, cls, label: cls==='up'?'Em alta':cls==='down'?'Em queda':'Estável'};
}
const status = d => d==null ? {cls:'warn',label:'Sem venda'} : d<=15 ? {cls:'crit',label:'Crítico'} : d<=30 ? {cls:'warn',label:'Atenção'} : {cls:'ok',label:'Confortável'};
const pctTxt = p => (p>0?'+':'')+nf(p*100,1)+'%';
const arrow = cls => cls==='up'?'▲':cls==='down'?'▼':'■';

function analyze(c){
  const chron = arr => MES_RECENTE_POR_ULTIMO ? arr : [...arr].reverse();
  const labels = chron(c.meses.length ? c.meses : (c.filiais[0]?.meses||[]).map((_,i)=>'Mês '+(i+1)));
  const cd = c.filiais.find(isCD);
  const lojas = c.filiais.filter(f=>!isCD(f)).map(f=>{
    const ms=chron(f.meses), tot=sum(ms);
    return {...f, ms, tot, avg:tot/(ms.length||1), trend:trendInfo(ms)};
  });
  const totMes = labels.map((_,i)=>sum(lojas.map(f=>f.ms[i])));
  const media = sum(totMes)/(labels.length||1);
  const ranking = [...lojas].sort((a,b)=>b.avg-a.avg);
  const estoque = cd ? cd.disponivel : 0;
  const dias = (cd && media) ? estoque/media*30 : null;
  return {labels, cd, lojas, ranking, totMes, media, estoque, dias, st: cd ? status(dias) : {cls:'warn',label:'CD não encontrado'},
          valor: cd ? cd.disponivel*(cd.vlr||0) : 0, trend:trendInfo(totMes),
          vendaMes: sum(lojas.map(f=>f.vendaMes||0)), best:ranking[0], worst:ranking[ranking.length-1]};
}

function calcItem(i, vendas){
  const consumo = sum(Object.keys(vendas).map(k=>porCesta(i.codigo,k)*vendas[k]));
  const dias = consumo ? i.quantidade/consumo*30 : null;
  return {...i, consumo, dias, baixo: dias!=null && dias<LIMITE_DIAS, atencao: dias!=null && dias>=LIMITE_DIAS && dias<45};
}

/* Itens vindos de planilha XLSX */
function parseItensWb(wb){
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    const hi=rows.findIndex(r=>r&&r.some(v=>norm(v).startsWith('descri'))&&r.some(v=>norm(v)==='quantidade')&&r.some(v=>norm(v).startsWith('codigo')));
    if(hi<0) continue;
    if(norm(name).includes('cesta 10')||norm(name).includes('cesta 15')) continue;
    const h=rows[hi].map(norm);
    const iC=h.findIndex(x=>x.startsWith('codigo')), iD=h.findIndex(x=>x.startsWith('descri')), iQ=h.findIndex(x=>x==='quantidade'),
          iU=h.findIndex(x=>x.includes('ult')||x.includes('entrada')), iT=h.findIndex(x=>x.includes('total'));
    const itens=rows.slice(hi+1).filter(r=>r&&r[iC]!=null&&r[iD]).map(r=>{
      const q=num(r[iQ])||0, t=iT>=0?num(r[iT]):null, u=iU>=0?num(r[iU]):null;
      return {codigo:String(r[iC]).trim(), descricao:String(r[iD]).trim(), quantidade:q, total: t!=null?t:(u||0)*q};
    });
    if(itens.length) return itens;
  }
  return null;
}

/* Itens vindos de foto (leitura de texto no navegador) */
const brNum = s => { s=String(s).replace(/[^\d.,]/g,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/\.\d{3}$/.test(s)) s=s.replace(/\./g,''); const n=parseFloat(s); return isNaN(n)?null:n; };
function parseOcr(text){
  const out=[];
  text.split(/\n+/).forEach(line=>{
    let s=line.replace(/R\s*\$|R\s*S(?=\s|\d)/gi,' ').replace(/[|\[\]{}“”"'_]/g,' ').replace(/\s+/g,' ').trim();
    const tk=s.split(' ');
    if(!/^\d{3,7}$/.test(tk[0])) return;
    const nums=[];
    while(tk.length>2 && nums.length<3 && /^[\d.,]+$/.test(tk[tk.length-1])) nums.unshift(tk.pop());
    if(nums.length<2) return;
    const codigo=tk.shift(), descricao=tk.join(' ').trim();
    const quantidade=Math.round(brNum(nums[0])||0);
    const total = nums.length===3 ? brNum(nums[2]) : brNum(nums[1]);
    const u = nums.length===3 ? brNum(nums[1]) : null;
    out.push({codigo, descricao, quantidade, total: total ?? (u||0)*quantidade});
  });
  return out;
}

  document.getElementById('revSave').onclick=()=>{
    const novos=[...body.querySelectorAll('tr')].map(tr=>({
      codigo:tr.querySelector('.r-cod').value.trim(), descricao:tr.querySelector('.r-desc').value.trim().toUpperCase(),
      quantidade:Math.round(brNum(tr.querySelector('.r-qtd').value)||0), total:brNum(tr.querySelector('.r-tot').value)||0
    })).filter(i=>i.codigo&&i.descricao);
    if(!novos.length){ alert('Nenhum item válido para salvar.'); return; }
    let lista=novos;
    if(document.getElementById('revKeep').checked){
      const m=new Map(itensState.itens.map(i=>[i.codigo,i]));
      novos.forEach(i=>m.set(i.codigo,i));
      lista=[...m.values()];
    }
    salvarItens(lista,'foto');
    document.getElementById('dlg').close();
    document.querySelector('[data-tab=itens]').click();
  };
  document.getElementById('dlg').showModal();
}

document.getElementById('btnFoto').addEventListener('click',()=>document.getElementById('foto').click());
document.getElementById('foto').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const btn=document.getElementById('btnFoto'), lbl=btn.querySelector('span'), old=lbl.innerHTML;
  btn.disabled=true; lbl.innerHTML='Lendo<br>foto…';
  try{
    if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const {data}=await Tesseract.recognize(f,'por');
    const itens=parseOcr(data.text);
    if(!itens.length) abrirRevisao(itensState.itens.map(i=>({...i})), 'Não consegui ler os itens dessa foto. Ajuste os valores manualmente abaixo ou tente uma foto mais nítida e reta.');
    else abrirRevisao(itens, itens.length<itensState.itens.length?`Li ${itens.length} de ${itensState.itens.length} itens. Confira se faltou algum.`:'');
  }catch(err){ const a=document.getElementById('alert'); a.textContent=err.message; a.hidden=false; }
  finally{ btn.disabled=false; lbl.innerHTML=old; }
});

render();
renderItens();
</script>
<script>
/* integração com o app de auditoria (quando aberto dentro da aba Cesta básica) */
(function(){var emb=false;try{emb=window.self!==window.top;}catch(e){emb=true;}
  if(emb){document.documentElement.classList.add('embed');var s=document.createElement('style');s.textContent='.embed .side-import{display:none!important}.embed body{padding-right:0!important}';document.head.appendChild(s);}
  window.cestaArquivo=function(f,tipo){var inp=document.getElementById(tipo==='foto'?'foto':'file');if(!inp||!f)return false;var dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;inp.dispatchEvent(new Event('change',{bubbles:true}));return true;};
})();
</script>
